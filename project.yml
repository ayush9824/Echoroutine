name: EchoRoutine
options:
  bundleIdPrefix: com.echoroutine
  deploymentTarget:
    iOS: 17.0
targets:
  EchoRoutine:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: App
      - path: Models
      - path: ViewModels
        optional: true
      - path: Views
      - path: Services
        optional: true
      - path: Resources
        optional: true
    settings:
      SWIFT_VERSION: 6.0
      SWIFT_STRICT_CONCURRENCY: complete
      DEVELOPMENT_TEAM: "" # Set by developer in Xcode if needed
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0

  EchoRoutineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources: EchoRoutineTests
    dependencies:
      - target: EchoRoutine
    settings:
      SWIFT_VERSION: 6.0
      SWIFT_STRICT_CONCURRENCY: complete
      GENERATE_INFOPLIST_FILE: YES
